services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  mattermost:
    image: mattermost/mattermost-team-edition:9.9
    ports:
      - "8065:8065"
    environment:
      DB_HOST: postgres
      DB_PORT_NUMBER: 5432
      DB_NAME: mattermost
      DB_USER: mmuser
      DB_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      MM_SERVICESETTINGS_SITEURL: ${MATTERMOST_URL:-http://localhost:8065}
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:${DB_PASSWORD:-SecurePassword123!}@postgres:5432/mattermost?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mattermost_data:/mattermost/data
      - mattermost_config:/mattermost/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8065/api/v4/system/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  mattermost_data:
  mattermost_config:
